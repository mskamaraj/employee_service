name: Employee Service CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Build Docker image
        run: docker build -t employee-service .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::544893998643:role/GitHubActionsEmployeeServiceRole
          aws-region: ap-south-1
      
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag employee-service:latest \
          544893998643.dkr.ecr.ap-south-1.amazonaws.com/employee-service:${{github.sha}}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
          544893998643.dkr.ecr.ap-south-1.amazonaws.com/employee-service:${{github.sha}}

      - name: Deploy to ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_URI=544893998643.dkr.ecr.ap-south-1.amazonaws.com/employee-service:${{github.sha}}

          echo "Deploying image: $IMAGE_URI"

          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition employee-service \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEFINITION=$(echo "$TASK_DEFINITION" | \
            jq --arg IMAGE_URI "$IMAGE_URI" \
            'del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
              ) |
              .containerDefinitions[0].image = $IMAGE_URI')
              
          echo "$NEW_TASK_DEFINITION" > task-definition.json

          NEW_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
        

          echo "New task definition: $NEW_TASK_DEFINITION_ARN"

          aws ecs update-service \
            --cluster employee-service-cluster \
            --service employee-service \
            --task-definition "$NEW_TASK_DEFINITION_ARN"

          echo "Deployment started successfully"
